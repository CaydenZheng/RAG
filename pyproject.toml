[project]
name = "ragrag"
version = "0.1.0"
description = "PocketFlow-based RAG and agent application"
readme = "README.md"
# Expand the supported Python range after validating additional versions.
requires-python = ">=3.13,<3.14"
dependencies = [
    "pocketflow==0.0.3",
    "openai==2.54.0",
    "litellm==1.100.0",
    "tiktoken==0.14.0",
    "markitdown==0.1.7",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "jieba==0.42.1",
    "sentence-transformers==6.0.1",
    "langchain-text-splitters==1.1.2",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "loguru==0.7.3",
    "pyyaml==6.0.3",
    "tenacity==9.1.4",
    "langfuse==4.15.1",
    "duckduckgo-search==8.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "numpy==2.5.2",
]
eval = [
    "ragas==0.4.3",
    "pandas==3.0.5",
    "datasets==5.0.1",
    # 0.4.x broke the legacy Ragas import path in the validated environment.
    "langchain-community==0.3.31",
    "langchain-openai==1.6.0",
]

[tool.uv]
package = false
required-version = ">=0.12.11"

[tool.pytest.ini_options]
testpaths = [
    "tests/test_rrf.py",
    "tests/test_agent.py",
    "tests/offline",
]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"

[tool.ruff]
required-version = "==0.16.6"
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["pocketflow"]
