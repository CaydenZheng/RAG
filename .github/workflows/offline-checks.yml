name: Offline checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master, ci/offline-checks]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-linux:
    name: Offline / ubuntu-24.04 / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lock file
        run: uv lock --check
      - name: Install runtime and development dependencies
        run: uv sync --locked --no-default-groups --group dev
      - name: Check baseline code
        run: uv run --no-sync --offline --no-env-file ruff check app.py src/api src/orchestration src/web src/agent/tools.py src/core/indexing.py src/core/index_versions.py src/core/retrieval.py src/core/ingestion.py src/infra/index_catalog.py src/infra/uploads.py src/utils/bm25_store.py tests/conftest.py tests/offline_environment.py tests/offline_fakes.py tests/offline scripts/build_index.py scripts/demo_eval_metrics.py scripts/run_eval.py
      - name: Run offline tests
        run: uv run --no-sync --offline --no-env-file python -B -m pytest -q --junitxml="${{ runner.temp }}/offline-results.xml"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-results-ubuntu-24.04
          path: ${{ runner.temp }}/offline-results.xml
          if-no-files-found: ignore
          retention-days: 7

  offline-windows:
    # PRs opt in when dependencies, paths, startup, filesystem, or concurrency
    # behavior changes. Pushes to master and manual runs always verify Windows.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'cross-platform')
    name: Offline / windows-2022 / Python 3.13
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lock file
        run: uv lock --check
      - name: Install runtime and development dependencies
        run: uv sync --locked --no-default-groups --group dev
      - name: Check baseline code
        run: uv run --no-sync --offline --no-env-file ruff check app.py src/api src/orchestration src/web src/agent/tools.py src/core/indexing.py src/core/index_versions.py src/core/retrieval.py src/core/ingestion.py src/infra/index_catalog.py src/infra/uploads.py src/utils/bm25_store.py tests/conftest.py tests/offline_environment.py tests/offline_fakes.py tests/offline scripts/build_index.py scripts/demo_eval_metrics.py scripts/run_eval.py
      - name: Run offline tests
        run: uv run --no-sync --offline --no-env-file python -B -m pytest -q --junitxml="${{ runner.temp }}/offline-results.xml"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-results-windows-2022
          path: ${{ runner.temp }}/offline-results.xml
          if-no-files-found: ignore
          retention-days: 7
