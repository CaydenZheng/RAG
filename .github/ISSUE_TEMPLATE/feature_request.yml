name: Feature request
description: 建议与项目定位一致的改进
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述具体使用场景，而不只是期望采用的技术。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望行为、范围和用户可见结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议适用于本地开发或小规模服务部署，不依赖企业级基础设施。
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
