<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAGFlow Agent</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/agent.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🤖 RAGFlow Agent</h1>
    <p>Plan → Execute → Observe 循环 &middot; <a id="newSessionLink" href="#">🔄 新会话</a> &middot; <a href="/">🔍 RAG 搜索</a></p>
  </div>

  <div class="input-box">
    <input id="msgInput" type="text" placeholder="输入消息，例如：search knowledge base for gradient descent" autofocus>
    <button id="sendBtn">发送</button>
    <button id="stopBtn">⏹ 停止</button>
  </div>

  <div id="loading" class="loading">🤔 Agent 思考中...</div>
  <div id="error" class="error"></div>

  <div class="chat-area">
    <div id="thinking"></div>
    <div id="answerCard" class="answer-card hidden">
      <h2>💬 最终答案</h2>
      <div id="answer" class="answer-text"></div>
    </div>
  </div>

  <div class="latency">⏱ 耗时 <span id="latency">—</span> &middot; 迭代 <span id="iterCount">—</span> 轮</div>
</div>

<script src="/static/rendering.js" defer></script>
<script src="/static/agent.js" defer></script>
</body>
</html>
