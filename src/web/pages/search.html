<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAGFlow</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/search.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>&#128269; RAGFlow</h1>
    <p>基于 PocketFlow 的高级 RAG 系统 &middot; 混合检索 + Rerank &middot; <a id="newSessionLink" href="#">🔄 新会话</a> &middot; <a href="/agent">🤖 Agent 模式</a></p>
  </div>

  <div class="search-box">
    <input id="queryInput" type="text" placeholder="输入问题，例如：What is the half-life of actinium?" autofocus>
    <button id="searchBtn">搜索</button>
    <button id="stopBtn" class="stop">⏹ 停止</button>
  </div>

  <div id="loading" class="loading">&#9203; 检索中，请稍候...</div>
  <div id="error" class="error"></div>

  <div id="result" class="result">
    <div class="answer-card">
      <h2>&#128172; 答案</h2>
      <div id="answer" class="answer-text"></div>
    </div>

    <div class="sources-title">&#128214; 引用来源（共 <span id="sourceCount">0</span> 条）</div>
    <div id="sources"></div>

    <div class="latency">&#9201; 耗时 <span id="latency">0</span> ms</div>
  </div>
</div>

<script src="/static/rendering.js" defer></script>
<script src="/static/search.js" defer></script>
</body>
</html>
